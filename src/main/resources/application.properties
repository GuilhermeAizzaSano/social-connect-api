# ====================================================
# SocialConnect API - Configuração de Desenvolvimento
# ====================================================

# Nome da aplicação
spring.application.name=socialconnect-api

# Porta do servidor
server.port=8080

# ===========================================================
# Banco de Dados (H2 em memória)
# ===========================================================
spring.datasource.url=jdbc:h2:mem:socialconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=123456

# =========================================================
# Console H2 (Acesso via navegador para inspecionar dados)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Desativa restrição de frames para compatibilidade com o navegador
spring.h2.console.settings.web-allow-others=true

# ==========================================
# JPA / Hibernate
# ==========================================
# Desativa Open-in-View para remover warnings e seguir boas práticas
spring.jpa.open-in-view=false

# Cria as tabelas na inicialização e descarta ao parar a aplicação
spring.jpa.hibernate.ddl-auto=create-drop

# Exibe e formata as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SpringDoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.info.title=SocialConnect API
springdoc.info.description=API RESTful de gestão para instituições sociais (ITE005)
springdoc.info.version=0.0.1-SNAPSHOT

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# RFC 7807 Problem Details
# ==========================================
spring.mvc.problemdetails.enabled=true